<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Multilevel Speaking Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" data-route="home">Multilevel <span class="brand-accent">Speaking</span></div>
        <nav>
          <a href="#" data-route="home">Home</a>
          <a href="#" data-route="progress">Progress</a>
          <a href="#" id="open-upload">My questions</a>
          <button id="audio-toggle" class="audio-toggle" title="Toggle voice-over" aria-label="Toggle voice-over">
            <span class="audio-icon-on">🔊</span>
            <span class="audio-icon-off hidden">🔇</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="main"></main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- Templates -->
  <template id="tpl-home">
    <section class="screen home">
      <h1 class="display">Practise the<br/>Multilevel<br/><span class="accent">Speaking</span> exam.</h1>
      <p class="subtitle">Three parts. Fifteen minutes. AI-graded against the official CEFR-aligned criteria.</p>
      <div class="grid-buttons">
        <button class="big-btn" data-start="1">Part 1 only<span class="hint">~3.5 min</span></button>
        <button class="big-btn" data-start="2">Part 2 only<span class="hint">~3 min</span></button>
        <button class="big-btn" data-start="3">Part 3 only<span class="hint">~3 min</span></button>
        <button class="big-btn primary" data-start="1,2,3">Full mock test<span class="hint">~15 min</span></button>
      </div>
      <label class="custom-toggle">
        <input type="checkbox" id="use-custom-only" />
        <span>Use <strong>my own</strong> uploaded questions only</span>
        <span class="custom-toggle-stats mono" id="custom-toggle-stats">0 uploaded</span>
      </label>
      <p class="footnote">Make sure your microphone is connected. You'll be asked for permission when recording starts.</p>
    </section>
  </template>

  <template id="tpl-upload-modal">
    <div class="modal-backdrop">
      <div class="modal-card">
        <button class="modal-close" aria-label="Close">&times;</button>
        <h2 class="serif">My questions</h2>
        <p class="muted">Add questions one at a time using the form, or drop in a JSON pack. Anything you add becomes available in mock tests — tick "Use my own uploaded questions only" on the home screen to drill on only your own.</p>

        <div class="upload-stats" id="upload-stats">
          <div class="us-row"><span>Part 1 · personal</span><b class="mono" data-key="part1_personal">0</b></div>
          <div class="us-row"><span>Part 1 · picture compare</span><b class="mono" data-key="part1_compare">0</b></div>
          <div class="us-row"><span>Part 2 · long turn</span><b class="mono" data-key="part2">0</b></div>
          <div class="us-row"><span>Part 3 · for / against</span><b class="mono" data-key="part3">0</b></div>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="type" type="button" role="tab">Type a question</button>
          <button class="tab" data-tab="json" type="button" role="tab">Upload JSON file</button>
        </div>

        <div class="tab-panel" data-panel="type">
          <label class="form-row">
            <span class="form-label">What kind of question?</span>
            <select id="type-kind">
              <option value="part1_personal">Part 1 — personal question</option>
              <option value="part1_compare">Part 1 — picture compare</option>
              <option value="part2">Part 2 — long turn (3 questions)</option>
              <option value="part3">Part 3 — for / against debate</option>
            </select>
          </label>
          <div class="form-fields" id="form-fields"></div>
          <button class="file-pick add-btn" id="add-question" type="button">Add question</button>
        </div>

        <div class="tab-panel hidden" data-panel="json">
          <div class="upload-row">
            <label class="file-pick">
              <input type="file" id="upload-file" accept="application/json,.json" />
              <span>Choose JSON file…</span>
            </label>
            <button class="link-btn" id="download-template" type="button">Download template</button>
          </div>
          <details class="upload-help">
            <summary class="serif">JSON format</summary>
<pre class="code-block"><code>{
  "part1_personal": [
    { "text": "Tell me about your favourite teacher." }
  ],
  "part1_compare": [
    {
      "pic1": { "emoji": "🍕", "label": "Eating at home" },
      "pic2": { "emoji": "🍔", "label": "Eating fast food" },
      "questions": [
        "What can you see in each picture?",
        "Which do you usually prefer, and why?"
      ]
    }
  ],
  "part2": [
    {
      "picture": { "emoji": "🎮", "label": "A favourite game" },
      "questions": [
        "Tell me about a game you enjoy playing.",
        "Why do you find it interesting?",
        "How can games be useful for learning?"
      ]
    }
  ],
  "part3": [
    {
      "topic": "Should homework be banned at primary school?",
      "for_bullets": [
        "More time for sport and family",
        "Less stress for young children",
        "Encourages curiosity, not duty",
        "Teachers can cover everything in class"
      ],
      "against_bullets": [
        "Builds study habits early",
        "Reinforces what was learnt in class",
        "Prepares pupils for higher grades",
        "Parents can see what is being studied"
      ]
    }
  ]
}</code></pre>
          </details>
        </div>

        <div class="upload-result hidden" id="upload-result"></div>

        <div class="modal-footer">
          <button class="link-btn danger" id="clear-custom" type="button">Clear all my questions</button>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-part-active">
    <section class="screen part-active">
      <div class="part-header">
        <div class="part-counter mono"></div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>

      <div class="part-stage">
        <aside class="stage-side">
          <div class="phase-label"></div>
          <div class="timer mono">00</div>
          <button class="replay-btn" type="button" title="Replay question audio">
            <span class="replay-icon">🔁</span>
            <span class="replay-label">Replay question</span>
          </button>
          <div class="recording-indicator hidden">
            <span class="dot"></span> Recording
          </div>
        </aside>

        <div class="stage-main">
          <div class="visual-area"></div>
          <div class="prompt-text serif"></div>
          <div class="live-transcript"></div>
        </div>
      </div>

      <div class="controls">
        <button class="skip-btn">Skip to next</button>
      </div>
    </section>
  </template>

  <template id="tpl-intermission">
    <section class="screen intermission">
      <h2 class="serif"></h2>
      <p class="big-countdown mono">5</p>
      <p class="muted">The next part starts automatically.</p>
    </section>
  </template>

  <template id="tpl-transcribing">
    <section class="screen transcribing">
      <div class="spinner"></div>
      <p class="serif">Saving your answer…</p>
      <p class="muted">Transcript captured live in your browser.</p>
    </section>
  </template>

  <template id="tpl-grading">
    <section class="screen grading">
      <div class="spinner"></div>
      <p class="serif">Grading your session…</p>
      <p class="muted">Comparing your performance against CEFR B1–C1 anchors.</p>
    </section>
  </template>

  <template id="tpl-results">
    <section class="screen results">
      <div class="score-card">
        <div class="score-number mono"></div>
        <div class="score-meta">
          <div class="score-out-of mono">/ 75</div>
          <div class="score-band"></div>
        </div>
      </div>

      <div class="criteria">
        <div class="crit-row" data-key="discourse"><span class="crit-name">Discourse Management</span><span class="crit-score mono"></span></div>
        <div class="crit-row" data-key="grammar"><span class="crit-name">Grammar Range &amp; Accuracy</span><span class="crit-score mono"></span></div>
        <div class="crit-row" data-key="vocabulary"><span class="crit-name">Vocabulary Range &amp; Appropriacy</span><span class="crit-score mono"></span></div>
        <div class="crit-row" data-key="pronunciation"><span class="crit-name">Pronunciation <span class="muted small">(estimated from transcript)</span></span><span class="crit-score mono"></span></div>
        <div class="crit-row total"><span class="crit-name">Raw total</span><span class="crit-score mono"></span></div>
      </div>

      <details class="feedback-block" open>
        <summary class="serif">Examiner feedback</summary>
        <div class="feedback-body"></div>
      </details>

      <details class="tips-block">
        <summary class="serif">Improvement tips</summary>
        <ul class="tips-list"></ul>
      </details>

      <details class="answers-block">
        <summary class="serif">Your answers</summary>
        <div class="answers-list"></div>
      </details>

      <button class="big-btn primary" data-route="home">Try again</button>
    </section>
  </template>

  <template id="tpl-progress">
    <section class="screen progress">
      <h2 class="serif">Your progress</h2>
      <div class="chart-wrap"><canvas id="progress-chart"></canvas></div>
      <table class="sessions-table">
        <thead><tr><th>Date</th><th>Parts</th><th>Score</th><th>Band</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </template>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
